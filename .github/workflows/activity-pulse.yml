name: Update activity pulse

on:
  schedule:
    - cron: '31 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render public activity
        run: python3 scripts/update_pulse.py
      - name: Commit updated card
        run: |
          if ! git diff --quiet -- activity-pulse.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add activity-pulse.svg
            git commit -m 'Update activity pulse'
            git push
          fi
